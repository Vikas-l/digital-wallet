# Infrastructure only (default):    docker compose up -d
# Infrastructure + both services:   docker compose --profile app up -d --build
# Kafka UI (optional, extra ~250MB): docker compose --profile tools up -d
name: digital-wallet

x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: digitalwallet
  DB_PASSWORD: digitalwallet
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseSerialGC

services:
  mysql:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: digitalwallet
      MYSQL_PASSWORD: digitalwallet
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 640m

  # fake SMTP server for local development: catches every email, web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  wallet-service:
    profiles: ["app"]
    image: digital-wallet-wallet-service:latest
    build:
      context: .
      args:
        SERVICE: wallet-service
    environment:
      <<: *app-env
      DB_NAME: wallet_db
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      TRANSFERS_PER_MINUTE: ${TRANSFERS_PER_MINUTE:-10}
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 640m

  rewards-service:
    profiles: ["app"]
    image: digital-wallet-rewards-service:latest
    build:
      context: .
      args:
        SERVICE: rewards-service
    environment:
      <<: *app-env
      DB_NAME: rewards_db
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8082:8082"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 640m

  kafka-ui:
    profiles: ["tools"]
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: digitalwallet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 384m

volumes:
  mysql-data:
  redis-data:
  kafka-data:
