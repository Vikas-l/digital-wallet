name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # unit + Testcontainers integration tests (Docker is available on GitHub runners)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Build Docker images
        run: |
          docker build --build-arg SERVICE=wallet-service -t digitalwallet/wallet-service:${{ github.sha }} .
          docker build --build-arg SERVICE=rewards-service -t digitalwallet/rewards-service:${{ github.sha }} .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
