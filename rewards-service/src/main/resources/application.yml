server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: rewards-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:rewards_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:digitalwallet}
    password: ${DB_PASSWORD:digitalwallet}
    hikari:
      maximum-pool-size: 20
      # fail fast under overload (answered with 503 + Retry-After) instead of queueing for long
      connection-timeout: 3000
      # a payment waits at most 5s for a locked wallet row (MySQL default: 50s)
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: rewards-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
  ai:
    model:
      # only the chat model is used; keep the other OpenAI auto-configurations off
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # any OpenAI-compatible endpoint works (OpenAI, Groq, Ollama, ...)
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.0

digitalwallet:
  redis-address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  business-zone: Asia/Kolkata
  rule-cache-ttl: 10m
  # origins allowed to call this API from a browser (the web UI is served by wallet-service)
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  jwt:
    # must match wallet-service (the token issuer)
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: digitalwallet
  ai:
    enabled: ${AI_ENABLED:false}
  outbox:
    batch-size: 100
    poll-interval-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.apache.kafka: WARN
    org.redisson: WARN
